# lefthook - Git hook manager configuration
# https://github.com/evilmartians/lefthook
#
# Setup: aqua install && lefthook install
# (If upgrading from the old githooks/ setup: git config --unset core.hooksPath first)

pre-commit:
  parallel: false
  commands:
    api-format:
      glob: "api/**"
      root: "api/"
      run: task format

    api-lint:
      glob: "api/**"
      root: "api/"
      run: task lint

    api-test:
      glob: "api/**"
      root: "api/"
      run: task test

    web-check:
      glob: "web/**"
      root: "web/"
      run: pnpm check

    trivy-secret:
      run: trivy fs --scanners secret --severity HIGH,CRITICAL --exit-code 1 {staged_files}

    trivy-misconfig:
      glob: "**/Dockerfile*"
      run: trivy config --severity HIGH,CRITICAL --exit-code 1 {staged_files}

pre-push:
  commands:
    buf-lint:
      glob: "proto/**/*.proto"
      root: "proto/"
      run: buf lint

    buf-generate-check:
      glob: "proto/**/*.proto"
      root: "proto/"
      run: |
        buf generate
        if ! git diff --exit-code -- ../api/pkg/gen/; then
          echo "Generated code is stale. Run 'cd proto && buf generate' and commit the changes."
          exit 1
        fi
        echo "Generated code is up to date."

    buf-breaking:
      glob: "proto/**/*.proto"
      root: "proto/"
      run: buf breaking --against '.git#subdir=proto'
