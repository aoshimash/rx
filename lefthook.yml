# lefthook - Git hook manager configuration
# https://github.com/evilmartians/lefthook
#
# Setup: aqua install && lefthook install
# (If upgrading from the old githooks/ setup: git config --unset core.hooksPath first)

pre-commit:
  parallel: false
  commands:
    api-format:
      glob: "api/**"
      root: "api/"
      run: task format

    api-lint:
      glob: "api/**"
      root: "api/"
      run: task lint

    api-test:
      glob: "api/**"
      root: "api/"
      run: task test

    web-check:
      glob: "web/**"
      root: "web/"
      run: pnpm check

    trivy-secret:
      run: trivy fs --scanners secret --severity HIGH,CRITICAL --exit-code 1 {staged_files}

    trivy-misconfig:
      glob: "**/Dockerfile*"
      run: trivy config --severity HIGH,CRITICAL --exit-code 1 {staged_files}

pre-push:
  commands:
    api-generate-check:
      glob: "api/openapi/openapi.yaml"
      root: "api/"
      run: |
        task generate
        if ! git diff --exit-code HEAD -- pkg/openapi/server.gen.go; then
          echo "❌ Generated code is stale. Run 'cd api && task generate' and commit the changes."
          exit 1
        fi
        echo "✅ Generated code is up to date."
