services:
  postgres:
    image: postgres:17
    container_name: optel-workout-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optel}
      POSTGRES_DB: ${POSTGRES_DB:-optel_workout}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: optel-workout-api
    environment:
      - PORT=${PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: optel-workout-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-docs:
    image: scalarapi/api-reference:latest
    container_name: optel-workout-api-docs
    ports:
      - "${API_DOCS_PORT:-8081}:8080"
    volumes:
      - ./api/openapi/openapi.yaml:/docs/openapi.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
