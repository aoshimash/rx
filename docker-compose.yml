services:
  dev:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: optel-training-dev
    volumes:
      - ./api:/workspace
      - go-mod-cache:/go/pkg/mod
    working_dir: /workspace
    environment:
      - PORT=8080
      - LOG_LEVEL=info
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    command: tail -f /dev/null  # Keep container running

volumes:
  go-mod-cache:
