services:
  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    container_name: rx-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rx}
      POSTGRES_DB: ${POSTGRES_DB:-rx_workout}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rx-api
    environment:
      - HTTP_PORT=${HTTP_PORT:-8080}
      - GRPC_PORT=${GRPC_PORT:-9090}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${HOST_PORT:-8080}:8080"
      - "${GRPC_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: rx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped


volumes:
  postgres_data:
  minio_data:
