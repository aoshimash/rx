syntax = "proto3";

package rx.api.v1;

option go_package = "github.com/aoshimash/rx/api/pkg/gen/rx/api/v1";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service ProgramService {
  rpc CreateProgram(CreateProgramRequest) returns (CreateProgramResponse) {
    option (google.api.http) = {
      post: "/api/v1/programs"
      body: "*"
    };
  }

  rpc GetProgram(GetProgramRequest) returns (GetProgramResponse) {
    option (google.api.http) = {get: "/api/v1/programs/{id}"};
  }

  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsResponse) {
    option (google.api.http) = {get: "/api/v1/programs"};
  }

  rpc UpdateProgram(UpdateProgramRequest) returns (UpdateProgramResponse) {
    option (google.api.http) = {
      put: "/api/v1/programs/{id}"
      body: "*"
    };
  }

  rpc UpdateProgramStatus(UpdateProgramStatusRequest) returns (UpdateProgramStatusResponse) {
    option (google.api.http) = {
      put: "/api/v1/programs/{id}/status"
      body: "*"
    };
  }

  rpc DeleteProgram(DeleteProgramRequest) returns (DeleteProgramResponse) {
    option (google.api.http) = {delete: "/api/v1/programs/{id}"};
  }
}

enum ProgramStatus {
  PROGRAM_STATUS_UNSPECIFIED = 0;
  PROGRAM_STATUS_DRAFT = 1;
  PROGRAM_STATUS_PUBLISHED = 2;
}

// Program is a training template with sessions and entries.
message Program {
  string id = 1;
  string name = 2;
  string notes = 3;
  repeated ProgramGroup groups = 4;
  repeated ProgramSession sessions = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  ProgramStatus status = 8;
}

message ProgramGroup {
  string id = 1;
  string program_id = 2;
  string parent_group_id = 3;
  string name = 4;
  int32 order = 5;
  string notes = 6;
}

message ProgramGroupCreate {
  string temp_id = 1;
  string name = 2;
  int32 order = 3;
  string parent_group_id = 4;
  string notes = 5;
}

message ProgramSession {
  string id = 1;
  string program_id = 2;
  string group_id = 3;
  string session_name = 4;
  int32 order = 5;
  string field_group_id = 6;
  string date = 7; // YYYY-MM-DD format
  repeated ProgramSessionEntry entries = 8;
}

message ProgramSessionCreate {
  string session_name = 1;
  int32 order = 2;
  string group_id = 3;
  string field_group_id = 4;
  string date = 5; // YYYY-MM-DD format
  repeated ProgramSessionEntryCreate entries = 6;
}

message ProgramSessionEntry {
  string id = 1;
  string session_id = 2;
  int32 order = 3;
  string exercise_name = 4;
  google.protobuf.Struct fields = 5;
  string notes = 6;
}

message ProgramSessionEntryCreate {
  string exercise_name = 1;
  int32 order = 2;
  google.protobuf.Struct fields = 3;
  string notes = 4;
}

message CreateProgramRequest {
  string name = 1;
  string notes = 2;
  repeated ProgramGroupCreate groups = 3;
  repeated ProgramSessionCreate sessions = 4;
  ProgramStatus status = 5;
}

message CreateProgramResponse {
  Program program = 1;
}

message GetProgramRequest {
  string id = 1;
}

message GetProgramResponse {
  Program program = 1;
}

message ListProgramsRequest {
  int32 limit = 1;
  string after = 2;
}

message ListProgramsResponse {
  repeated Program data = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message UpdateProgramRequest {
  string id = 1;
  string name = 2;
  string notes = 3;
  repeated ProgramGroupCreate groups = 4;
  repeated ProgramSessionCreate sessions = 5;
  ProgramStatus status = 6;
}

message UpdateProgramResponse {
  Program program = 1;
}

message UpdateProgramStatusRequest {
  string id = 1;
  ProgramStatus status = 2;
}

message UpdateProgramStatusResponse {
  Program program = 1;
}

message DeleteProgramRequest {
  string id = 1;
}

message DeleteProgramResponse {}
