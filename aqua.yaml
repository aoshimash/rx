# aqua - Tool Version Manager Configuration
# This file ensures consistent tool versions across local development and CI environments

registries:
  - type: standard
    ref: v4.311.0  # aqua-registry version

packages:
  # Go compiler
  - name: golang/go@1.25.6

  # OpenAPI code generator
  - name: oapi-codegen/oapi-codegen@v2.5.1

  # Go linter
  - name: golangci/golangci-lint@v2.8.0

  # GitHub CLI
  - name: cli/cli@v2.67.0

  # Task runner (Makefile alternative)
  - name: go-task/task@v3.43.3
