name: API CI

on:
  push:
    branches: [main]
    paths: &api-ci-paths
      - 'api/**'
      - '.github/workflows/api-ci.yml'
      - 'aqua.yaml'
  pull_request:
    branches: [main]
    paths: *api-ci-paths

jobs:
  api-format-lint-test:
    name: API - Format, Lint and Test
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup aqua
        uses: aquaproj/aqua-installer@v4.0.0
        with:
          aqua_version: v2.45.0

      - name: Cache aqua tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/aquaproj-aqua
          key: ${{ runner.os }}-aqua-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aqua-

      - name: Install tools via aqua
        run: |
          if [ ! -f aqua.yaml ]; then
            echo "Error: aqua.yaml not found"
            exit 1
          fi
          aqua install

      - name: Add aqua bin to PATH
        run: echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Makefile targets
        working-directory: api
        run: make deps generate format lint test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          file: ./api/coverage.out
          flags: unittests
          name: codecov-api
          fail_ci_if_error: false

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes detected"
            git status
            git diff || true
            exit 1
          fi
