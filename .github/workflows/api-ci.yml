name: API CI

on:
  push:
    branches: [main]
    paths: &api-ci-paths
      - 'api/**'
      - '.github/workflows/api-ci.yml'
      - 'aqua.yaml'
  pull_request:
    branches: [main]
    paths: *api-ci-paths

jobs:
  api-format-lint-test:
    name: API - Format, Lint and Test
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Cache Go modules
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache aqua tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: ~/.local/share/aquaproj-aqua
          key: ${{ runner.os }}-aqua-v2.45.0-${{ hashFiles('aqua.yaml', '.github/workflows/api-ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-aqua-v2.45.0-
            ${{ runner.os }}-aqua-

      - name: Setup aqua
        uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.45.0

      - name: Install tools via aqua
        run: |
          if [ ! -f aqua.yaml ]; then
            echo "Error: aqua.yaml not found"
            exit 1
          fi
          aqua install

      - name: Add aqua bin to PATH
        run: echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH

      - name: Start MinIO container
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          
          echo "Waiting for MinIO to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/ready 2>/dev/null; then
              echo "MinIO is ready!"
              exit 0
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          echo "MinIO failed to become ready"
          docker logs minio
          exit 1

      - name: Run Makefile targets
        working-directory: api
        run: |
          make deps
          make generate
          make format
          make lint
          make test-coverage

      - name: Run integration tests
        working-directory: api
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: make test-integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          file: ./api/coverage.out
          flags: unittests
          name: codecov-api
          fail_ci_if_error: false

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes detected"
            git status
            git diff || true
            exit 1
          fi
