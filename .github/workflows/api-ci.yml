name: API CI

on:
  push:
    branches: [main]
    paths: &api-ci-paths
      - 'api/**'
      - '.github/workflows/api-ci.yml'
      - 'aqua.yaml'
  pull_request:
    branches: [main]
    paths: *api-ci-paths

jobs:
  # Job 1: Format check and Lint (fast feedback)
  lint:
    name: Format and Lint
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache aqua tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/aquaproj-aqua
          key: ${{ runner.os }}-aqua-v2.45.0-${{ hashFiles('aqua.yaml', '.github/workflows/api-ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-aqua-v2.45.0-
            ${{ runner.os }}-aqua-

      - name: Setup aqua
        uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.45.0

      - name: Install tools via aqua
        run: |
          if [ ! -f aqua.yaml ]; then
            echo "Error: aqua.yaml not found"
            exit 1
          fi
          aqua install

      - name: Add aqua bin to PATH
        run: echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH

      - name: Download dependencies
        working-directory: api
        run: task deps

      - name: Generate code
        working-directory: api
        run: task generate

      - name: Check formatting
        working-directory: api
        run: task format

      - name: Lint
        working-directory: api
        run: |
          go build ./...
          golangci-lint run ./...

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes detected"
            git status
            git diff || true
            exit 1
          fi

  # Job 2: Unit tests with coverage (runs in parallel with lint and integration tests)
  test-unit:
    name: Unit Test
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache aqua tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/aquaproj-aqua
          key: ${{ runner.os }}-aqua-v2.45.0-${{ hashFiles('aqua.yaml', '.github/workflows/api-ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-aqua-v2.45.0-
            ${{ runner.os }}-aqua-

      - name: Setup aqua
        uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.45.0

      - name: Install tools via aqua
        run: |
          if [ ! -f aqua.yaml ]; then
            echo "Error: aqua.yaml not found"
            exit 1
          fi
          aqua install

      - name: Add aqua bin to PATH
        run: echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH

      - name: Download dependencies
        working-directory: api
        run: task deps

      - name: Test with coverage
        working-directory: api
        run: task test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          files: ./api/coverage.out
          flags: unittests
          name: codecov-api
          fail_ci_if_error: false

  # Job 3: Integration tests (runs in parallel with lint and unit tests)
  test-integration:
    name: Integration Test
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache aqua tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/aquaproj-aqua
          key: ${{ runner.os }}-aqua-v2.45.0-${{ hashFiles('aqua.yaml', '.github/workflows/api-ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-aqua-v2.45.0-
            ${{ runner.os }}-aqua-

      - name: Setup aqua
        uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.45.0

      - name: Install tools via aqua
        run: |
          if [ ! -f aqua.yaml ]; then
            echo "Error: aqua.yaml not found"
            exit 1
          fi
          aqua install

      - name: Add aqua bin to PATH
        run: echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH

      - name: Start MinIO container
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          
          echo "Waiting for MinIO to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/ready 2>/dev/null; then
              echo "MinIO is ready!"
              exit 0
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          echo "MinIO failed to become ready"
          docker logs minio
          exit 1

      - name: Download dependencies
        working-directory: api
        run: task deps

      - name: Run integration tests
        working-directory: api
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: task test-integration
