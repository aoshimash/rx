openapi: 3.0.3
info:
  title: Rx API
  version: 0.3.0
servers:
  - url: http://localhost:8080/api/v1

# Global security requirement
security:
  - bearerAuth: []

paths:
  /program-templates:
    get:
      summary: List program templates
      operationId: listProgramTemplates
      tags: [ProgramTemplate]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
          description: When true, archived program templates are included in results
      responses:
        '200':
          description: Paginated list of program templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTemplateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create program template
      operationId: createProgramTemplate
      tags: [ProgramTemplate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramTemplateCreate'
      responses:
        '201':
          description: Program template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /program-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/ProgramTemplateId'
    get:
      summary: Get program template by ID
      operationId: getProgramTemplate
      tags: [ProgramTemplate]
      responses:
        '200':
          description: Program template found (includes all entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete program template
      operationId: deleteProgramTemplate
      tags: [ProgramTemplate]
      responses:
        '204':
          description: Program template deleted (entries cascade deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /program-templates/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProgramTemplateId'
    post:
      summary: Archive program template
      operationId: archiveProgramTemplate
      tags: [ProgramTemplate]
      responses:
        '200':
          description: Program template archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /program-templates/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ProgramTemplateId'
    post:
      summary: Unarchive program template
      operationId: unarchiveProgramTemplate
      tags: [ProgramTemplate]
      responses:
        '200':
          description: Program template unarchived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /program-templates/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProgramTemplateId'
    post:
      summary: Duplicate program template
      description: Creates a deep copy of the ProgramTemplate with all entries. Optionally accepts a custom name; defaults to appending " (copy)".
      operationId: duplicateProgramTemplate
      tags: [ProgramTemplate]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateProgramTemplateRequest'
      responses:
        '201':
          description: Program template duplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /program-templates/{id}/generate:
    parameters:
      - $ref: '#/components/parameters/ProgramTemplateId'
    post:
      summary: Generate a Program from this template
      description: |
        Creates a concrete Program from a ProgramTemplate by calculating working weights
        from RPE/percent_1rm values and target weights, rounded to equipment increments.
        Entries are grouped by metadata.session — one ProgramSession per session group.
        Returns the newly created Program with all sessions embedded.
      operationId: generateProgram
      tags: [ProgramTemplate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProgramRequest'
      responses:
        '201':
          description: Program generated from template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /program-templates/{id}/edit:
    parameters:
      - $ref: '#/components/parameters/ProgramTemplateId'
    post:
      summary: Edit program template
      description: |
        Edits a program template in-place. Templates linked to one or more Programs cannot be edited
        and return 409 Conflict. Only unlinked templates can be modified.
      operationId: editProgramTemplate
      tags: [ProgramTemplate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramTemplateCreate'
      responses:
        '200':
          description: Template updated in-place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /programs:
    get:
      summary: List programs
      operationId: listPrograms
      tags: [Program]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: program_template_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter programs by source program template ID
        - name: status
          in: query
          schema:
            type: string
            enum: [created, ongoing, completed, cancelled]
          description: Filter programs by status
      responses:
        '200':
          description: Paginated list of programs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create program
      operationId: createProgram
      tags: [Program]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /programs/{id}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      summary: Get program by ID
      operationId: getProgram
      tags: [Program]
      responses:
        '200':
          description: Program found (includes all sessions and entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete program
      operationId: deleteProgram
      tags: [Program]
      responses:
        '204':
          description: Program deleted (sessions and entries cascade deleted, referencing logs have program_id cleared)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    patch:
      summary: Update program status
      operationId: updateProgramStatus
      tags: [Program]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [created, ongoing, completed, cancelled]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{id}/logged-sessions:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      summary: List distinct logged session names for a program
      description: |
        Returns an array of distinct session names that have at least one log entry
        for the given program. Used by the frontend to determine session completion status
        without pagination limits.
      operationId: listLoggedSessions
      tags: [Program]
      responses:
        '200':
          description: Distinct logged session names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /logs:
    get:
      summary: List logs
      operationId: listLogs
      tags: [Log]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter logs by program ID
        - name: performed_at_from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter logs at or after this timestamp
        - name: performed_at_to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter logs before this timestamp
      responses:
        '200':
          description: Paginated list of logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create log
      operationId: createLog
      tags: [Log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCreate'
      responses:
        '201':
          description: Log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /logs/{id}:
    parameters:
      - $ref: '#/components/parameters/LogId'
    get:
      summary: Get log by ID
      operationId: getLog
      tags: [Log]
      responses:
        '200':
          description: Log found (includes all entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update log
      operationId: updateLog
      tags: [Log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCreate'
      responses:
        '200':
          description: Log updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete log
      operationId: deleteLog
      tags: [Log]
      responses:
        '204':
          description: Log deleted (entries cascade deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /videos/upload-url:
    post:
      summary: Generate pre-signed URL for video upload
      description: |
        Generates a pre-signed URL for uploading a video file directly to object storage.
        The client should use this URL to upload the video via HTTP PUT.
        After successful upload, include the returned object_key in the LogEntry.
      operationId: generateVideoUploadURL
      tags: [Video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUploadURLRequest'
      responses:
        '200':
          description: Pre-signed upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadURLResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Storage service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                message: Video storage is not configured

  /videos/download-url:
    post:
      summary: Generate pre-signed URL for video download
      description: |
        Generates a pre-signed URL for downloading a video file from object storage.
        The client should use this URL to download the video via HTTP GET.
      operationId: generateVideoDownloadURL
      tags: [Video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoDownloadURLRequest'
      responses:
        '200':
          description: Pre-signed download URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDownloadURLResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Storage service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                message: Video storage is not configured

components:
  # ========================================
  # Security Schemes
  # ========================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Authentication required for all endpoints.
        Implementation details (JWT, API key) to be defined.

  # ========================================
  # Parameters
  # ========================================
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      description: Maximum number of items to return

    After:
      name: after
      in: query
      schema:
        type: string
      description: Cursor for pagination (from previous response)

    ProgramTemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Program Template ID

    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Program ID

    LogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Log ID

  # ========================================
  # Responses
  # ========================================
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required

    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Invalid request body
            details:
              field: name
              reason: required field missing

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Resource not found

    Conflict:
      description: Cannot perform action due to existing references
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: Cannot delete program template - referenced by programs
            details:
              blocking_references:
                - type: program
                  count: 3

  # ========================================
  # Schemas
  # ========================================
  schemas:
    # ========================================
    # ProgramTemplate
    # ========================================
    ProgramTemplate:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramTemplateEntry'
          description: Exercise prescription entries (RPE-based, no absolute weights)
        weeks:
          type: string
          nullable: true
          maxLength: 50
          description: Duration in weeks (e.g., "3", "6~8")
        days_per_week:
          type: string
          nullable: true
          maxLength: 50
          description: Training days per week (e.g., "2", "2~3")
        created_by:
          type: string
          nullable: true
          description: User ID of the creator
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: When set, the program template is archived and hidden from default list results

    ProgramTemplateCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
        weeks:
          type: string
          maxLength: 50
          description: Duration in weeks (e.g., "3", "6~8")
        days_per_week:
          type: string
          maxLength: 50
          description: Training days per week (e.g., "2", "2~3")
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramTemplateEntryCreate'
          maxItems: 1000

    ProgramTemplateEntry:
      type: object
      required:
        - id
        - program_template_id
        - order
        - exercise_name
      properties:
        id:
          type: string
          format: uuid
        program_template_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position within the session
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Exercise name (plain string)
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Target Rate of Perceived Exertion
        percent_1rm:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Percentage of 1RM (0.0 to 1.0) for weight calculation
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true

    ProgramTemplateEntryCreate:
      type: object
      required:
        - exercise_name
        - order
      properties:
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type: integer
          minimum: 0
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        rpe:
          type: integer
          minimum: 1
          maximum: 10
        percent_1rm:
          type: number
          format: double
          minimum: 0
          maximum: 1
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true

    ProgramTemplateListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProgramTemplate'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    DuplicateProgramTemplateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          description: Custom name for the duplicate. If omitted, defaults to "{original name} (copy)".

    GenerateProgramRequest:
      type: object
      required:
        - target_weights
      properties:
        name:
          type: string
          maxLength: 200
          description: Name for the generated program (defaults to template name)
        target_weights:
          type: object
          additionalProperties:
            type: number
            format: double
          description: |
            Map of exercise_name to target weight in kg.
            For entries with percent_1rm: load_kg = percent_1rm * target_weight.
            For entries without percent_1rm: load_kg = target_weight (direct copy).
        load_increments:
          type: object
          additionalProperties:
            type: number
            format: double
          description: |
            Map of exercise_name to weight increment in kg for rounding.
            If not specified, weights are rounded to 0.1 kg precision.

    # ========================================
    # Program
    # ========================================
    Program:
      type: object
      required:
        - id
        - name
        - status
        - sessions
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        program_template_id:
          type: string
          format: uuid
          nullable: true
          description: Reference to the source program template (null for manually created programs)
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [created, ongoing, completed, cancelled]
          description: created = registered not yet started, ongoing = in progress, completed = all sessions logged and confirmed, cancelled = stopped mid-way
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata (e.g., generation parameters)
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSession'
          description: Ordered training sessions (each contains entries with absolute weights)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgramCreate:
      type: object
      required:
        - name
        - sessions
      properties:
        program_template_id:
          type: string
          format: uuid
          description: Optional reference to source program template
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSessionCreate'
          minItems: 1
          maxItems: 100

    ProgramSession:
      type: object
      required:
        - id
        - program_id
        - session_name
        - order
        - entries
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        session_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Day name within the week (e.g., "Day 1", "Heavy", "Volume")
        order:
          type: integer
          minimum: 0
          description: Global position in program (0-based)
        date:
          type: string
          format: date
          description: Scheduled date for this session (YYYY-MM-DD, optional)
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSessionEntry'
          description: Exercise prescriptions with absolute weights

    ProgramSessionCreate:
      type: object
      required:
        - session_name
        - order
      properties:
        session_name:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type: integer
          minimum: 0
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSessionEntryCreate'
          maxItems: 1000

    ProgramSessionEntry:
      type: object
      required:
        - id
        - session_id
        - order
        - exercise_name
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in session
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Exercise name (plain string)
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
          description: Weight in kilograms (0.1 precision)
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Rate of Perceived Exertion
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata

    ProgramSessionEntryCreate:
      type: object
      required:
        - exercise_name
        - order
      properties:
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type: integer
          minimum: 0
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
        rpe:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true

    ProgramListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Program'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    LoggedSession:
      type: object
      required:
        - session_name
        - log_id
        - performed_at
      properties:
        session_name:
          type: string
        log_id:
          type: string
          format: uuid
        performed_at:
          type: string
          format: date-time
          description: Date and time the session was performed
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Start time of the session, used to calculate duration
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: End time of the session, used to calculate duration

    LoggedSessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/LoggedSession'
          description: Sessions that have a log for this program, each including the log ID for navigation

    # ========================================
    # Log
    # ========================================
    Log:
      type: object
      required:
        - id
        - performed_at
        - entries
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
          nullable: true
          description: Optional reference to the training program
        session_name:
          type: string
          maxLength: 200
          description: Session name (used together with program_id)
        performed_at:
          type: string
          format: date-time
          description: When the training was performed
        notes:
          type: string
          maxLength: 5000
          description: General session notes
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata (e.g., body_weight_kg, fatigue_level)
        started_at:
          type: string
          format: date-time
          description: When the training session started (optional)
        finished_at:
          type: string
          format: date-time
          description: When the training session ended (optional)
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
          minItems: 1
          description: Performed entries (ordered)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LogCreate:
      type: object
      required:
        - performed_at
        - entries
      properties:
        program_id:
          type: string
          format: uuid
          description: Optional reference to a training program
        session_name:
          type: string
          maxLength: 200
          description: Session name (used together with program_id)
        performed_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 5000
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntryCreate'
          minItems: 1

    LogEntry:
      type: object
      required:
        - id
        - log_id
        - order
        - exercise_name
      properties:
        id:
          type: string
          format: uuid
        log_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in log
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Exercise name (plain string)
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
          description: Weight in kilograms (0.1 precision)
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Rate of Perceived Exertion
        notes:
          type: string
          maxLength: 2000
        video_object_key:
          type: string
          maxLength: 500
          description: Object key for uploaded video in storage (from upload-url response)
        started_at:
          type: string
          format: date-time
          description: When the exercise started (optional)
        finished_at:
          type: string
          format: date-time
          description: When the exercise ended (optional)
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata

    LogEntryCreate:
      type: object
      required:
        - exercise_name
      properties:
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
        rpe:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
          maxLength: 2000
        video_object_key:
          type: string
          maxLength: 500
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    # ========================================
    # Pagination Response Types
    # ========================================
    LogListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Log'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    # ========================================
    # Video
    # ========================================
    VideoUploadURLRequest:
      type: object
      required:
        - content_type
        - filename
        - content_length
      properties:
        content_type:
          type: string
          description: MIME type of the video file (must be video/*)
          example: video/mp4
        filename:
          type: string
          maxLength: 255
          description: Original filename
          example: deadlift.mp4
        content_length:
          type: integer
          format: int64
          minimum: 1
          description: File size in bytes
          example: 52428800

    VideoUploadURLResponse:
      type: object
      required:
        - upload_url
        - object_key
        - expires_in
      properties:
        upload_url:
          type: string
          format: uri
          description: Pre-signed URL for uploading the video via HTTP PUT
        object_key:
          type: string
          description: Object key to be stored in LogEntry.video_object_key after successful upload
        expires_in:
          type: integer
          description: Seconds until the upload URL expires
          example: 900

    VideoDownloadURLRequest:
      type: object
      required:
        - object_key
      properties:
        object_key:
          type: string
          maxLength: 500
          description: Object key from LogEntry.video_object_key

    VideoDownloadURLResponse:
      type: object
      required:
        - download_url
        - expires_in
      properties:
        download_url:
          type: string
          format: uri
          description: Pre-signed URL for downloading the video via HTTP GET
        expires_in:
          type: integer
          description: Seconds until the download URL expires
          example: 3600

    # ========================================
    # Common Response Types
    # ========================================
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details
