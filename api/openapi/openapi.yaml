openapi: 3.0.3
info:
  title: OPTel Workout API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1

# Global security requirement
security:
  - bearerAuth: []

paths:
  /workouts:
    get:
      summary: List workouts
      operationId: listWorkouts
      tags: [Workout]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: timestamp_from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter workouts at or after this timestamp
        - name: timestamp_to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter workouts before this timestamp
      responses:
        '200':
          description: Paginated list of workouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create workout
      operationId: createWorkout
      tags: [Workout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutCreate'
      responses:
        '201':
          description: Workout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workouts/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkoutId'
    get:
      summary: Get workout by ID
      operationId: getWorkout
      tags: [Workout]
      responses:
        '200':
          description: Workout found (includes all entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update workout
      operationId: updateWorkout
      tags: [Workout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutCreate'
      responses:
        '200':
          description: Workout updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete workout
      operationId: deleteWorkout
      tags: [Workout]
      responses:
        '204':
          description: Workout deleted (entries cascade deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /exercises:
    get:
      summary: List exercises
      operationId: listExercises
      tags: [Exercise]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Paginated list of exercises
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create exercise
      operationId: createExercise
      tags: [Exercise]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseCreate'
      responses:
        '201':
          description: Exercise created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /exercises/{id}:
    parameters:
      - $ref: '#/components/parameters/ExerciseId'
    get:
      summary: Get exercise by ID
      operationId: getExercise
      tags: [Exercise]
      responses:
        '200':
          description: Exercise found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update exercise
      operationId: updateExercise
      tags: [Exercise]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseCreate'
      responses:
        '200':
          description: Exercise updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete exercise
      operationId: deleteExercise
      tags: [Exercise]
      responses:
        '204':
          description: Exercise deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /programs:
    get:
      summary: List programs
      operationId: listPrograms
      tags: [Program]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Paginated list of programs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create program
      operationId: createProgram
      tags: [Program]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /programs/{id}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      summary: Get program by ID
      operationId: getProgram
      tags: [Program]
      responses:
        '200':
          description: Program found (includes all entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update program
      operationId: updateProgram
      tags: [Program]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete program
      operationId: deleteProgram
      tags: [Program]
      responses:
        '204':
          description: Program deleted (entries cascade deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /telemetry:
    get:
      summary: List telemetry points
      operationId: listTelemetryPoints
      tags: [Telemetry]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: metric_name
          in: query
          schema:
            type: string
          description: Filter by metric name
        - name: timestamp_from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter points at or after this timestamp
        - name: timestamp_to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter points before this timestamp
      responses:
        '200':
          description: Paginated list of telemetry points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPointListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create telemetry point
      operationId: createTelemetryPoint
      tags: [Telemetry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPointCreate'
      responses:
        '201':
          description: Telemetry point created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPoint'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /telemetry/{id}:
    parameters:
      - $ref: '#/components/parameters/TelemetryPointId'
    get:
      summary: Get telemetry point by ID
      operationId: getTelemetryPoint
      tags: [Telemetry]
      responses:
        '200':
          description: Telemetry point found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update telemetry point
      operationId: updateTelemetryPoint
      tags: [Telemetry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPointCreate'
      responses:
        '200':
          description: Telemetry point updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPoint'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete telemetry point
      operationId: deleteTelemetryPoint
      tags: [Telemetry]
      responses:
        '204':
          description: Telemetry point deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /videos/upload-url:
    post:
      summary: Generate pre-signed URL for video upload
      description: |
        Generates a pre-signed URL for uploading a video file directly to object storage.
        The client should use this URL to upload the video via HTTP PUT.
        After successful upload, include the returned object_key in the WorkoutEntry.
      operationId: generateVideoUploadURL
      tags: [Video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUploadURLRequest'
      responses:
        '200':
          description: Pre-signed upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadURLResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Storage service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                message: Video storage is not configured

  /videos/download-url:
    post:
      summary: Generate pre-signed URL for video download
      description: |
        Generates a pre-signed URL for downloading a video file from object storage.
        The client should use this URL to download the video via HTTP GET.
      operationId: generateVideoDownloadURL
      tags: [Video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoDownloadURLRequest'
      responses:
        '200':
          description: Pre-signed download URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDownloadURLResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Storage service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                message: Video storage is not configured

components:
  # ========================================
  # Security Schemes
  # ========================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Authentication required for all endpoints.
        Implementation details (JWT, API key) to be defined.

  # ========================================
  # Parameters
  # ========================================
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      description: Maximum number of items to return

    After:
      name: after
      in: query
      schema:
        type: string
      description: Cursor for pagination (from previous response)

    ExerciseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Exercise ID

    WorkoutId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workout ID

    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Program ID

    TelemetryPointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Telemetry point ID

  # ========================================
  # Responses
  # ========================================
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required

    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Invalid request body
            details:
              field: name
              reason: required field missing

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Resource not found

    Conflict:
      description: Cannot perform action due to existing references
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: Cannot delete exercise - referenced by workout entries
            details:
              blocking_references:
                - type: workout_entry
                  count: 5

  # ========================================
  # Schemas
  # ========================================
  schemas:
    # ========================================
    # Exercise
    # ========================================
    Exercise:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Canonical exercise name
        description:
          type: string
          maxLength: 2000
          description: Optional description
        aliases:
          type: array
          items:
            type: string
          description: Alternative names for matching
        muscle_groups:
          type: array
          items:
            type: string
          description: Target muscle groups
        load_increment:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Minimum weight increment (kg)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExerciseCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        aliases:
          type: array
          items:
            type: string
        muscle_groups:
          type: array
          items:
            type: string
        load_increment:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true

    # ========================================
    # Workout
    # ========================================
    Workout:
      type: object
      required:
        - id
        - timestamp
        - entries
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the session occurred
        session_start:
          type: string
          format: date-time
          description: Precise start time
        session_end:
          type: string
          format: date-time
          description: Precise end time
        body_weight_kg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Body weight at session (kg)
        fatigue_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Subjective fatigue (1=fresh, 5=very fatigued)
        sleep_hours:
          type: number
          format: double
          minimum: 0
          maximum: 24
          description: Sleep before session (hours)
        condition_notes:
          type: string
          maxLength: 2000
          description: Freeform condition notes
        program_node_id:
          type: string
          format: uuid
          description: Link to planned day/block
        program_context:
          type: array
          items:
            type: string
          description: Hierarchy path snapshot (e.g., ["Cycle 1", "Week 3", "Day 2"])
        notes:
          type: string
          maxLength: 5000
          description: General session notes
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutEntry'
          minItems: 1
          description: Performed entries (ordered)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkoutCreate:
      type: object
      required:
        - timestamp
        - entries
      properties:
        timestamp:
          type: string
          format: date-time
        session_start:
          type: string
          format: date-time
        session_end:
          type: string
          format: date-time
        body_weight_kg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        fatigue_level:
          type: integer
          minimum: 1
          maximum: 5
        sleep_hours:
          type: number
          format: double
          minimum: 0
          maximum: 24
        condition_notes:
          type: string
          maxLength: 2000
        program_node_id:
          type: string
          format: uuid
        program_context:
          type: array
          items:
            type: string
        notes:
          type: string
          maxLength: 5000
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutEntryCreate'
          minItems: 1

    # ========================================
    # WorkoutEntry
    # ========================================
    WorkoutEntry:
      type: object
      required:
        - id
        - workout_id
        - order
        - exercise_id
        - sets
        - reps
        - load_kg
        - rpe
      properties:
        id:
          type: string
          format: uuid
        workout_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in workout
        exercise_id:
          type: string
          format: uuid
          description: Exercise performed
        display_name:
          type: string
          maxLength: 200
          description: Override display name
        entry_type:
          type: string
          maxLength: 50
          nullable: true
          description: Entry type (e.g., top, main, backoff). User-defined values allowed.
        sets:
          type: integer
          minimum: 1
          description: Number of sets performed
        reps:
          type: integer
          minimum: 1
          description: Reps per set
        load_kg:
          type: number
          format: double
          minimum: 0
          description: Weight in kilograms (0.1 precision)
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Rate of Perceived Exertion
        entry_start:
          type: string
          format: date-time
        entry_end:
          type: string
          format: date-time
        planned_rest_seconds:
          type: integer
          minimum: 0
          description: Planned rest between sets
        performed_rest_seconds:
          type: integer
          minimum: 0
          description: Actual rest between sets
        per_set_rest_overrides:
          type: array
          items:
            type: integer
            minimum: 0
          description: Per-set rest overrides (seconds)
        program_node_id:
          type: string
          format: uuid
          description: Link to prescription
        plan_snapshot:
          $ref: '#/components/schemas/PlanSnapshot'
        notes:
          type: string
          maxLength: 2000
        video_object_key:
          type: string
          maxLength: 500
          description: Object key for uploaded video in storage (from upload-url response)

    WorkoutEntryCreate:
      type: object
      required:
        - exercise_id
        - sets
        - reps
        - load_kg
        - rpe
      properties:
        exercise_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 200
        entry_type:
          type: string
          maxLength: 50
          nullable: true
          description: Entry type (e.g., top, main, backoff). User-defined values allowed.
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
        rpe:
          type: integer
          minimum: 1
          maximum: 10
        entry_start:
          type: string
          format: date-time
        entry_end:
          type: string
          format: date-time
        planned_rest_seconds:
          type: integer
          minimum: 0
        performed_rest_seconds:
          type: integer
          minimum: 0
        per_set_rest_overrides:
          type: array
          items:
            type: integer
            minimum: 0
        program_node_id:
          type: string
          format: uuid
        plan_snapshot:
          $ref: '#/components/schemas/PlanSnapshot'
        notes:
          type: string
          maxLength: 2000
        video_object_key:
          type: string
          maxLength: 500
          description: Object key for uploaded video in storage (from upload-url response)

    # ========================================
    # PlanSnapshot
    # ========================================
    PlanSnapshot:
      type: object
      description: Snapshot of planned values at execution time
      properties:
        program_node_id:
          type: string
          format: uuid
          description: Reference to original prescription
        target_sets:
          type: integer
          minimum: 1
        target_reps:
          type: integer
          minimum: 1
        target_rpe:
          type: integer
          minimum: 1
          maximum: 10
        target_load_kg:
          type: number
          format: double
          minimum: 0
        percent_1rm:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Target %1RM (0.0-1.0, e.g., 0.75 = 75%)
        planned_rest_seconds:
          type: integer
          minimum: 0

    # ========================================
    # Program
    # ========================================
    Program:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramEntry'
          description: Flat list of training prescription entries
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgramCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramEntryCreate'
          maxItems: 1000

    # ========================================
    # ProgramEntry
    # ========================================
    ProgramEntry:
      type: object
      required:
        - id
        - program_id
        - name
        - order
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Entry label (e.g., "Squat - Top Set")
        order:
          type: integer
          minimum: 0
          description: Global position in program
        metadata:
          type: object
          additionalProperties: true
          description: |
            Free-form JSON for contextual grouping.
            Common keys: week (string), day (string).
            Example: {"week": "Week 1", "day": "Day A"}
        exercise_id:
          type: string
          format: uuid
        target_sets:
          type: integer
          minimum: 1
        target_reps:
          type: integer
          minimum: 1
        target_rpe:
          type: integer
          minimum: 1
          maximum: 10
        percent_1rm:
          type: number
          format: double
          minimum: 0
