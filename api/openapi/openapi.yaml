openapi: 3.0.3
info:
  title: OPTel Workout API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /workouts:
    get:
      summary: List workouts
      operationId: listWorkouts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workout'

components:
  schemas:
    # ========================================
    # Exercise
    # ========================================
    Exercise:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Canonical exercise name
        description:
          type: string
          maxLength: 2000
          description: Optional description
        aliases:
          type: array
          items:
            type: string
          description: Alternative names for matching
        muscle_groups:
          type: array
          items:
            type: string
          description: Target muscle groups
        load_increment:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Minimum weight increment (kg)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExerciseCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        aliases:
          type: array
          items:
            type: string
        muscle_groups:
          type: array
          items:
            type: string
        load_increment:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true

    # ========================================
    # Workout
    # ========================================
    Workout:
      type: object
      required:
        - id
        - timestamp
        - entries
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the session occurred
        session_start:
          type: string
          format: date-time
          description: Precise start time
        session_end:
          type: string
          format: date-time
          description: Precise end time
        body_weight_kg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Body weight at session (kg)
        fatigue_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Subjective fatigue (1=fresh, 5=very fatigued)
        sleep_hours:
          type: number
          format: double
          minimum: 0
          maximum: 24
          description: Sleep before session (hours)
        condition_notes:
          type: string
          maxLength: 2000
          description: Freeform condition notes
        program_node_id:
          type: string
          format: uuid
          description: Link to planned day/block
        program_context:
          type: array
          items:
            type: string
          description: Hierarchy path snapshot (e.g., ["Cycle 1", "Week 3", "Day 2"])
        notes:
          type: string
          maxLength: 5000
          description: General session notes
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutEntry'
          minItems: 1
          description: Performed entries (ordered)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkoutCreate:
      type: object
      required:
        - timestamp
        - entries
      properties:
        timestamp:
          type: string
          format: date-time
        session_start:
          type: string
          format: date-time
        session_end:
          type: string
          format: date-time
        body_weight_kg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        fatigue_level:
          type: integer
          minimum: 1
          maximum: 5
        sleep_hours:
          type: number
          format: double
          minimum: 0
          maximum: 24
        condition_notes:
          type: string
          maxLength: 2000
        program_node_id:
          type: string
          format: uuid
        program_context:
          type: array
          items:
            type: string
        notes:
          type: string
          maxLength: 5000
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutEntryCreate'
          minItems: 1

    # ========================================
    # WorkoutEntry
    # ========================================
    WorkoutEntry:
      type: object
      required:
        - id
        - workout_id
        - order
        - exercise_id
        - entry_type
        - sets
        - reps
        - load_kg
        - rpe
      properties:
        id:
          type: string
          format: uuid
        workout_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in workout
        exercise_id:
          type: string
          format: uuid
          description: Exercise performed
        display_name:
          type: string
          maxLength: 200
          description: Override display name
        entry_type:
          type: string
          enum: [top, main, backoff, accessory]
          description: Entry type
        sets:
          type: integer
          minimum: 1
          description: Number of sets performed
        reps:
          type: integer
          minimum: 1
          description: Reps per set
        load_kg:
          type: number
          format: double
          minimum: 0
          description: Weight in kilograms (0.1 precision)
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Rate of Perceived Exertion
        entry_start:
          type: string
          format: date-time
        entry_end:
          type: string
          format: date-time
        planned_rest_seconds:
          type: integer
          minimum: 0
          description: Planned rest between sets
        performed_rest_seconds:
          type: integer
          minimum: 0
          description: Actual rest between sets
        per_set_rest_overrides:
          type: array
          items:
            type: integer
            minimum: 0
          description: Per-set rest overrides (seconds)
        program_node_id:
          type: string
          format: uuid
          description: Link to prescription
        plan_snapshot:
          $ref: '#/components/schemas/PlanSnapshot'
        notes:
          type: string
          maxLength: 2000

    WorkoutEntryCreate:
      type: object
      required:
        - exercise_id
        - entry_type
        - sets
        - reps
        - load_kg
        - rpe
      properties:
        exercise_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 200
        entry_type:
          type: string
          enum: [top, main, backoff, accessory]
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
        rpe:
          type: integer
          minimum: 1
          maximum: 10
        entry_start:
          type: string
          format: date-time
        entry_end:
          type: string
          format: date-time
        planned_rest_seconds:
          type: integer
          minimum: 0
        performed_rest_seconds:
          type: integer
          minimum: 0
        per_set_rest_overrides:
          type: array
          items:
            type: integer
            minimum: 0
        program_node_id:
          type: string
          format: uuid
        plan_snapshot:
          $ref: '#/components/schemas/PlanSnapshot'
        notes:
          type: string
          maxLength: 2000

    # ========================================
    # PlanSnapshot
    # ========================================
    PlanSnapshot:
      type: object
      description: Snapshot of planned values at execution time
      properties:
        program_node_id:
          type: string
          format: uuid
          description: Reference to original prescription
        target_sets:
          type: integer
          minimum: 1
        target_reps:
          type: integer
          minimum: 1
        target_rpe:
          type: integer
          minimum: 1
          maximum: 10
        target_load_kg:
          type: number
          format: double
          minimum: 0
        percent_1rm:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Target %1RM (0.0-1.0, e.g., 0.75 = 75%)
        planned_rest_seconds:
          type: integer
          minimum: 0

    # ========================================
    # Program
    # ========================================
    Program:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        root_nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProgramNode'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgramCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        root_nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProgramNodeCreate'

    # ========================================
    # ProgramNode
    # ========================================
    ProgramNode:
      type: object
      required:
        - id
        - program_id
        - name
        - node_type
        - order
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          description: Parent node (null for root)
        name:
          type: string
          minLength: 1
          maxLength: 200
        node_type:
          type: string
          minLength: 1
          maxLength: 50
          description: User-defined type (cycle, week, day, block, exercise)
        order:
          type: integer
          minimum: 0
          description: Order among siblings
        children:
          type: array
          items:
            $ref: '#/components/schemas/ProgramNode'
        exercise_id:
          type: string
          format: uuid
        target_sets:
          type: integer
          minimum: 1
        target_reps:
          type: integer
          minimum: 1
        target_rpe:
          type: integer
          minimum: 1
          maximum: 10
        percent_1rm:
          type: number
          format: double
          minimum: 0
          maximum: 1
        planned_rest_seconds:
          type: integer
          minimum: 0
        muscle_groups:
          type: array
          items:
            type: string
        notes:
          type: string
          maxLength: 2000

    ProgramNodeCreate:
      type: object
      required:
        - name
        - node_type
        - order
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        node_type:
          type: string
          minLength: 1
          maxLength: 50
        order:
          type: integer
          minimum: 0
        children:
          type: array
          items:
            $ref: '#/components/schemas/ProgramNodeCreate'
        exercise_id:
          type: string
          format: uuid
        target_sets:
          type: integer
          minimum: 1
        target_reps:
          type: integer
          minimum: 1
        target_rpe:
          type: integer
          minimum: 1
          maximum: 10
        percent_1rm:
          type: number
          format: double
          minimum: 0
          maximum: 1
        planned_rest_seconds:
          type: integer
          minimum: 0
        muscle_groups:
          type: array
          items:
            type: string
        notes:
          type: string
          maxLength: 2000

    # ========================================
    # TelemetryPoint
    # ========================================
    TelemetryPoint:
      type: object
      required:
        - id
        - timestamp
        - metric_name
        - value
        - unit
        - created_at
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When metric was recorded
        metric_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Metric identifier
        value:
          type: number
          format: double
          description: Numeric value
        unit:
          type: string
          minLength: 1
          maxLength: 50
          description: Unit of measurement
        workout_id:
          type: string
          format: uuid
          description: Optional workout link
        created_at:
          type: string
          format: date-time

    TelemetryPointCreate:
      type: object
      required:
        - timestamp
        - metric_name
        - value
        - unit
      properties:
        timestamp:
          type: string
          format: date-time
        metric_name:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: number
          format: double
        unit:
          type: string
          minLength: 1
          maxLength: 50
        workout_id:
          type: string
          format: uuid

    # ========================================
    # Common Response Types
    # ========================================
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details
