openapi: 3.1.0
info:
  title: OPTel Workload API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /workloads:
    get:
      summary: List workloads
      operationId: listWorkloads
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    timestamp:
                      type: string
                      format: date-time
