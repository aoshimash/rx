openapi: 3.0.3
info:
  title: Rx API
  version: 0.2.0
servers:
  - url: http://localhost:8080/api/v1

# Global security requirement
security:
  - bearerAuth: []

paths:
  /programs:
    get:
      summary: List programs
      operationId: listPrograms
      tags: [Program]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
          description: When true, archived programs are included in results
      responses:
        '200':
          description: Paginated list of programs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create program
      operationId: createProgram
      tags: [Program]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /programs/{id}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      summary: Get program by ID
      operationId: getProgram
      tags: [Program]
      responses:
        '200':
          description: Program found (includes all entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete program
      operationId: deleteProgram
      tags: [Program]
      responses:
        '204':
          description: Program deleted (entries cascade deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /programs/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    post:
      summary: Archive program
      operationId: archiveProgram
      tags: [Program]
      responses:
        '200':
          description: Program archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    post:
      summary: Unarchive program
      operationId: unarchiveProgram
      tags: [Program]
      responses:
        '200':
          description: Program unarchived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    post:
      summary: Duplicate program
      description: Creates a deep copy of the Program with all entries, appending " (copy)" to the name.
      operationId: duplicateProgram
      tags: [Program]
      responses:
        '201':
          description: Program duplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cycles:
    get:
      summary: List cycles
      operationId: listCycles
      tags: [Cycle]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter cycles by program ID
      responses:
        '200':
          description: Paginated list of cycles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cycles/{id}:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    get:
      summary: Get cycle by ID
      operationId: getCycle
      tags: [Cycle]
      responses:
        '200':
          description: Cycle found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete cycle
      operationId: deleteCycle
      tags: [Cycle]
      responses:
        '204':
          description: Cycle deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plans:
    get:
      summary: List plans
      operationId: listPlans
      tags: [Plan]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter plans by source program ID
      responses:
        '200':
          description: Paginated list of plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create plan
      operationId: createPlan
      tags: [Plan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /plans/from-program:
    post:
      summary: Convert a program into plans (one per session)
      description: |
        Creates Plans from an existing Program by calculating working weights
        from RPE/percent_1rm values and target weights, rounded to equipment increments.
        Entries are grouped by metadata.session — one Plan per session.
      operationId: convertProgramToPlans
      tags: [Plan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertProgramToPlanRequest'
      responses:
        '201':
          description: Plans created from program
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /plans/{id}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      summary: Get plan by ID
      operationId: getPlan
      tags: [Plan]
      responses:
        '200':
          description: Plan found (includes all entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update plan
      operationId: updatePlan
      tags: [Plan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
      responses:
        '200':
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete plan
      operationId: deletePlan
      tags: [Plan]
      responses:
        '204':
          description: Plan deleted (entries cascade deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logs:
    get:
      summary: List logs
      operationId: listLogs
      tags: [Log]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: performed_at_from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter logs at or after this timestamp
        - name: performed_at_to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter logs before this timestamp
      responses:
        '200':
          description: Paginated list of logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create log
      operationId: createLog
      tags: [Log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCreate'
      responses:
        '201':
          description: Log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logs/{id}:
    parameters:
      - $ref: '#/components/parameters/LogId'
    get:
      summary: Get log by ID
      operationId: getLog
      tags: [Log]
      responses:
        '200':
          description: Log found (includes all entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update log
      operationId: updateLog
      tags: [Log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCreate'
      responses:
        '200':
          description: Log updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete log
      operationId: deleteLog
      tags: [Log]
      responses:
        '204':
          description: Log deleted (entries cascade deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /videos/upload-url:
    post:
      summary: Generate pre-signed URL for video upload
      description: |
        Generates a pre-signed URL for uploading a video file directly to object storage.
        The client should use this URL to upload the video via HTTP PUT.
        After successful upload, include the returned object_key in the LogEntry.
      operationId: generateVideoUploadURL
      tags: [Video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUploadURLRequest'
      responses:
        '200':
          description: Pre-signed upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadURLResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Storage service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                message: Video storage is not configured

  /videos/download-url:
    post:
      summary: Generate pre-signed URL for video download
      description: |
        Generates a pre-signed URL for downloading a video file from object storage.
        The client should use this URL to download the video via HTTP GET.
      operationId: generateVideoDownloadURL
      tags: [Video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoDownloadURLRequest'
      responses:
        '200':
          description: Pre-signed download URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDownloadURLResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Storage service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                message: Video storage is not configured

components:
  # ========================================
  # Security Schemes
  # ========================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Authentication required for all endpoints.
        Implementation details (JWT, API key) to be defined.

  # ========================================
  # Parameters
  # ========================================
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      description: Maximum number of items to return

    After:
      name: after
      in: query
      schema:
        type: string
      description: Cursor for pagination (from previous response)

    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Program ID

    CycleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cycle ID

    PlanId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Plan ID

    LogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Log ID

  # ========================================
  # Responses
  # ========================================
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required

    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Invalid request body
            details:
              field: name
              reason: required field missing

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Resource not found

    Conflict:
      description: Cannot perform action due to existing references
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: Cannot delete plan - referenced by logs
            details:
              blocking_references:
                - type: log
                  count: 5

  # ========================================
  # Schemas
  # ========================================
  schemas:
    # ========================================
    # Program
    # ========================================
    Program:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramEntry'
          description: Exercise prescription entries (RPE-based, no absolute weights)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: When set, the program is archived and hidden from default list results

    ProgramCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramEntryCreate'
          maxItems: 1000

    ProgramEntry:
      type: object
      required:
        - id
        - program_id
        - order
        - exercise_name
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in program
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Exercise name (plain string)
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Target Rate of Perceived Exertion
        percent_1rm:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Percentage of 1RM (0.0 to 1.0) for weight calculation
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata

    ProgramEntryCreate:
      type: object
      required:
        - exercise_name
        - order
      properties:
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type: integer
          minimum: 0
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        rpe:
          type: integer
          minimum: 1
          maximum: 10
        percent_1rm:
          type: number
          format: double
          minimum: 0
          maximum: 1
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true

    ProgramListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Program'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    # ========================================
    # Cycle
    # ========================================
    Cycle:
      type: object
      required:
        - id
        - program_id
        - name
        - created_at
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
          description: Reference to the source program
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata (e.g., conversion parameters)
        created_at:
          type: string
          format: date-time

    CycleListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Cycle'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    ConvertProgramToPlanRequest:
      type: object
      required:
        - program_id
        - target_weights
      properties:
        program_id:
          type: string
          format: uuid
          description: ID of the program to convert
        name:
          type: string
          maxLength: 200
          description: Name for the created plan (defaults to program name)
        target_weights:
          type: object
          additionalProperties:
            type: number
            format: double
          description: |
            Map of exercise_name to target weight in kg.
            For entries with percent_1rm: load_kg = percent_1rm * target_weight.
            For entries without percent_1rm: load_kg = target_weight (direct copy).
        load_increments:
          type: object
          additionalProperties:
            type: number
            format: double
          description: |
            Map of exercise_name to weight increment in kg for rounding.
            If not specified, weights are rounded to 0.1 kg precision.

    # ========================================
    # Plan
    # ========================================
    Plan:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
          description: Optional reference to the source program template
        cycle_id:
          type: string
          format: uuid
          description: Optional reference to the source cycle
        name:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date
          description: Scheduled date for this session (YYYY-MM-DD)
        session_name:
          type: string
          maxLength: 200
          description: Session name from the source program (e.g. "Day A", "Upper")
        description:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PlanEntry'
          description: Training prescription entries
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PlanCreate:
      type: object
      required:
        - name
      properties:
        program_id:
          type: string
          format: uuid
        cycle_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date
          description: Scheduled date for this session (YYYY-MM-DD)
        session_name:
          type: string
          maxLength: 200
          description: Session name (e.g. "Day A", "Upper")
        description:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PlanEntryCreate'
          maxItems: 1000

    PlanEntry:
      type: object
      required:
        - id
        - plan_id
        - order
        - exercise_name
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in plan
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Exercise name (plain string)
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
          description: Weight in kilograms (0.1 precision)
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Rate of Perceived Exertion
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata

    PlanEntryCreate:
      type: object
      required:
        - exercise_name
        - order
      properties:
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type: integer
          minimum: 0
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
        rpe:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true

    # ========================================
    # Log
    # ========================================
    Log:
      type: object
      required:
        - id
        - performed_at
        - entries
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
          description: Optional reference to the training plan
        performed_at:
          type: string
          format: date-time
          description: When the training was performed
        notes:
          type: string
          maxLength: 5000
          description: General session notes
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata (e.g., body_weight_kg, fatigue_level)
        started_at:
          type: string
          format: date-time
          description: When the training session started (optional)
        finished_at:
          type: string
          format: date-time
          description: When the training session ended (optional)
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
          minItems: 1
          description: Performed entries (ordered)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LogCreate:
      type: object
      required:
        - performed_at
        - entries
      properties:
        plan_id:
          type: string
          format: uuid
        performed_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 5000
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntryCreate'
          minItems: 1

    LogEntry:
      type: object
      required:
        - id
        - log_id
        - order
        - exercise_name
      properties:
        id:
          type: string
          format: uuid
        log_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in log
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Exercise name (plain string)
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
          description: Weight in kilograms (0.1 precision)
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Rate of Perceived Exertion
        notes:
          type: string
          maxLength: 2000
        video_object_key:
          type: string
          maxLength: 500
          description: Object key for uploaded video in storage (from upload-url response)
        started_at:
          type: string
          format: date-time
          description: When the exercise started (optional)
        finished_at:
          type: string
          format: date-time
          description: When the exercise ended (optional)
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata

    LogEntryCreate:
      type: object
      required:
        - exercise_name
      properties:
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        load_kg:
          type: number
          format: double
          minimum: 0
        rpe:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
          maxLength: 2000
        video_object_key:
          type: string
          maxLength: 500
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    # ========================================
    # Pagination Response Types
    # ========================================
    PlanListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    LogListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Log'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    # ========================================
    # Video
    # ========================================
    VideoUploadURLRequest:
      type: object
      required:
        - content_type
        - filename
        - content_length
      properties:
        content_type:
          type: string
          description: MIME type of the video file (must be video/*)
          example: video/mp4
        filename:
          type: string
          maxLength: 255
          description: Original filename
          example: deadlift.mp4
        content_length:
          type: integer
          format: int64
          minimum: 1
          description: File size in bytes
          example: 52428800

    VideoUploadURLResponse:
      type: object
      required:
        - upload_url
        - object_key
        - expires_in
      properties:
        upload_url:
          type: string
          format: uri
          description: Pre-signed URL for uploading the video via HTTP PUT
        object_key:
          type: string
          description: Object key to be stored in LogEntry.video_object_key after successful upload
        expires_in:
          type: integer
          description: Seconds until the upload URL expires
          example: 900

    VideoDownloadURLRequest:
      type: object
      required:
        - object_key
      properties:
        object_key:
          type: string
          maxLength: 500
          description: Object key from LogEntry.video_object_key

    VideoDownloadURLResponse:
      type: object
      required:
        - download_url
        - expires_in
      properties:
        download_url:
          type: string
          format: uri
          description: Pre-signed URL for downloading the video via HTTP GET
        expires_in:
          type: integer
          description: Seconds until the download URL expires
          example: 3600

    # ========================================
    # Common Response Types
    # ========================================
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details
