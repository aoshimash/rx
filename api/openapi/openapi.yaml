    # ========================================
    # Video
    # ========================================
    VideoUploadURLRequest:
      type: object
      required:
        - content_type
        - filename
        - content_length
      properties:
        content_type:
          type: string
          description: MIME type of the video file (must be video/*)
          example: video/mp4
        filename:
          type: string
          maxLength: 255
          description: Original filename
          example: deadlift.mp4
        content_length:
          type: integer
          format: int64
          minimum: 1
          description: File size in bytes
          example: 52428800

    VideoUploadURLResponse:
      type: object
      required:
        - upload_url
        - object_key
        - expires_in
      properties:
        upload_url:
          type: string
          format: uri
          description: Pre-signed URL for uploading the video via HTTP PUT
        object_key:
          type: string
          description: Object key to be stored in WorkoutEntry.video_object_key after successful upload
        expires_in:
          type: integer
          description: Seconds until the upload URL expires
          example: 900

    VideoDownloadURLRequest:
      type: object
      required:
        - object_key
      properties:
        object_key:
          type: string
          maxLength: 500
          description: Object key from WorkoutEntry.video_object_key

    VideoDownloadURLResponse:
      type: object
      required:
        - download_url
        - expires_in
      properties:
        download_url:
          type: string
          format: uri
          description: Pre-signed URL for downloading the video via HTTP GET
        expires_in:
          type: integer
          description: Seconds until the download URL expires
          example: 3600

    # ========================================
    # Common Response Types
    # ========================================
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details
