openapi: 3.0.3
info:
  title: Rx API
  version: 0.3.0
servers:
  - url: http://localhost:8080/api/v1

# Global security requirement
security:
  - bearerAuth: []

paths:
  /programs:
    get:
      summary: List programs
      operationId: listPrograms
      tags: [Program]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: status
          in: query
          schema:
            type: string
            enum: [created, ongoing, completed, cancelled]
          description: Filter programs by status
      responses:
        '200':
          description: Paginated list of programs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create program
      operationId: createProgram
      tags: [Program]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /programs/{id}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      summary: Get program by ID
      operationId: getProgram
      tags: [Program]
      responses:
        '200':
          description: Program found (includes all sessions and entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update program content
      description: |
        Replaces the program's name, notes, metadata, and session/entry structure.
        All sessions must be provided — this is a full replacement, not a partial update.
      operationId: updateProgram
      tags: [Program]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramUpdate'
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete program
      operationId: deleteProgram
      tags: [Program]
      responses:
        '204':
          description: Program deleted (sessions and entries cascade deleted, referencing logs have program_id cleared)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    patch:
      summary: Update program status
      operationId: updateProgramStatus
      tags: [Program]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [created, ongoing, completed, cancelled]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{id}/logged-sessions:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      summary: List distinct logged session names for a program
      description: |
        Returns an array of distinct session names that have at least one log entry
        for the given program. Used by the frontend to determine session completion status
        without pagination limits.
      operationId: listLoggedSessions
      tags: [Program]
      responses:
        '200':
          description: Distinct logged session names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /logs:
    get:
      summary: List logs
      operationId: listLogs
      tags: [Log]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter logs by program ID
        - name: performed_at_from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter logs at or after this timestamp
        - name: performed_at_to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter logs before this timestamp
      responses:
        '200':
          description: Paginated list of logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create log
      operationId: createLog
      tags: [Log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCreate'
      responses:
        '201':
          description: Log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /logs/{id}:
    parameters:
      - $ref: '#/components/parameters/LogId'
    get:
      summary: Get log by ID
      operationId: getLog
      tags: [Log]
      responses:
        '200':
          description: Log found (includes all entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update log
      operationId: updateLog
      tags: [Log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCreate'
      responses:
        '200':
          description: Log updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete log
      operationId: deleteLog
      tags: [Log]
      responses:
        '204':
          description: Log deleted (entries cascade deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /videos/upload-url:
    post:
      summary: Generate pre-signed URL for video upload
      description: |
        Generates a pre-signed URL for uploading a video file directly to object storage.
        The client should use this URL to upload the video via HTTP PUT.
        After successful upload, include the returned object_key in the LogEntry.
      operationId: generateVideoUploadURL
      tags: [Video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUploadURLRequest'
      responses:
        '200':
          description: Pre-signed upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadURLResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Storage service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                message: Video storage is not configured

  /videos/download-url:
    post:
      summary: Generate pre-signed URL for video download
      description: |
        Generates a pre-signed URL for downloading a video file from object storage.
        The client should use this URL to download the video via HTTP GET.
      operationId: generateVideoDownloadURL
      tags: [Video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoDownloadURLRequest'
      responses:
        '200':
          description: Pre-signed download URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDownloadURLResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Storage service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                message: Video storage is not configured

components:
  # ========================================
  # Security Schemes
  # ========================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Authentication required for all endpoints.
        Implementation details (JWT, API key) to be defined.

  # ========================================
  # Parameters
  # ========================================
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      description: Maximum number of items to return

    After:
      name: after
      in: query
      schema:
        type: string
      description: Cursor for pagination (from previous response)

    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Program ID

    LogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Log ID

  # ========================================
  # Responses
  # ========================================
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required

    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Invalid request body
            details:
              field: name
              reason: required field missing

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Resource not found

    Conflict:
      description: Cannot perform action due to existing references
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: Resource conflict

  # ========================================
  # Schemas
  # ========================================
  schemas:
    FieldDef:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Field key used in the fields object (e.g., "load_kg", "rpe")
        type:
          type: string
          enum: [text, number, select]
          description: Input type for this field
        options:
          type: array
          items:
            type: string
          description: Available options (only for type=select)

    # ========================================
    # Program
    # ========================================
    Program:
      type: object
      required:
        - id
        - name
        - status
        - sessions
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [created, ongoing, completed, cancelled]
          description: created = registered not yet started, ongoing = in progress, completed = all sessions logged and confirmed, cancelled = stopped mid-way
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata (e.g., generation parameters)
        program_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDef'
          description: Field definitions for program session entries
        log_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDef'
          description: Field definitions for log entries
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSession'
          description: Ordered training sessions (each contains entries with absolute weights)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgramCreate:
      type: object
      required:
        - name
        - sessions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
        program_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDef'
        log_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDef'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSessionCreate'
          minItems: 1
          maxItems: 100

    ProgramUpdate:
      type: object
      required:
        - name
        - sessions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        metadata:
          type: object
          additionalProperties: true
        program_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDef'
        log_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDef'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSessionCreate'
          minItems: 1
          maxItems: 100

    ProgramSession:
      type: object
      required:
        - id
        - program_id
        - session_name
        - order
        - entries
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        session_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Day name within the week (e.g., "Day 1", "Heavy", "Volume")
        order:
          type: integer
          minimum: 0
          description: Global position in program (0-based)
        date:
          type: string
          format: date
          description: Scheduled date for this session (YYYY-MM-DD, optional)
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSessionEntry'
          description: Exercise prescriptions with absolute weights

    ProgramSessionCreate:
      type: object
      required:
        - session_name
        - order
      properties:
        session_name:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type: integer
          minimum: 0
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSessionEntryCreate'
          maxItems: 1000

    ProgramSessionEntry:
      type: object
      required:
        - id
        - session_id
        - order
        - exercise_name
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in session
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Exercise name (plain string)
        fields:
          type: object
          additionalProperties: true
          description: Unified exercise data fields
        notes:
          type: string
          maxLength: 2000

    ProgramSessionEntryCreate:
      type: object
      required:
        - exercise_name
        - order
      properties:
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type: integer
          minimum: 0
        fields:
          type: object
          additionalProperties: true
          description: Unified exercise data fields
        notes:
          type: string
          maxLength: 2000

    ProgramListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Program'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    LoggedSession:
      type: object
      required:
        - session_name
        - log_id
        - performed_at
      properties:
        session_name:
          type: string
        log_id:
          type: string
          format: uuid
        performed_at:
          type: string
          format: date-time
          description: Date and time the session was performed
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Start time of the session, used to calculate duration
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: End time of the session, used to calculate duration

    LoggedSessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/LoggedSession'
          description: Sessions that have a log for this program, each including the log ID for navigation

    # ========================================
    # Log
    # ========================================
    Log:
      type: object
      required:
        - id
        - performed_at
        - entries
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
          nullable: true
          description: Optional reference to the training program
        session_name:
          type: string
          maxLength: 200
          description: Session name (used together with program_id)
        performed_at:
          type: string
          format: date-time
          description: When the training was performed
        notes:
          type: string
          maxLength: 5000
          description: General session notes
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata (e.g., body_weight_kg, fatigue_level)
        started_at:
          type: string
          format: date-time
          description: When the training session started (optional)
        finished_at:
          type: string
          format: date-time
          description: When the training session ended (optional)
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
          minItems: 1
          description: Performed entries (ordered)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LogCreate:
      type: object
      required:
        - performed_at
        - entries
      properties:
        program_id:
          type: string
          format: uuid
          description: Optional reference to a training program
        session_name:
          type: string
          maxLength: 200
          description: Session name (used together with program_id)
        performed_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 5000
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntryCreate'
          minItems: 1

    LogEntry:
      type: object
      required:
        - id
        - log_id
        - order
        - exercise_name
      properties:
        id:
          type: string
          format: uuid
        log_id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 0
          description: Position in log
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Exercise name (plain string)
        fields:
          type: object
          additionalProperties: true
          description: Unified exercise data fields
        notes:
          type: string
          maxLength: 2000
        video_object_key:
          type: string
          maxLength: 500
          description: Object key for uploaded video in storage (from upload-url response)
        started_at:
          type: string
          format: date-time
          description: When the exercise started (optional)
        finished_at:
          type: string
          format: date-time
          description: When the exercise ended (optional)

    LogEntryCreate:
      type: object
      required:
        - exercise_name
      properties:
        exercise_name:
          type: string
          minLength: 1
          maxLength: 200
        fields:
          type: object
          additionalProperties: true
          description: Unified exercise data fields
        notes:
          type: string
          maxLength: 2000
        video_object_key:
          type: string
          maxLength: 500
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    # ========================================
    # Pagination Response Types
    # ========================================
    LogListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Log'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    # ========================================
    # Video
    # ========================================
    VideoUploadURLRequest:
      type: object
      required:
        - content_type
        - filename
        - content_length
      properties:
        content_type:
          type: string
          description: MIME type of the video file (must be video/*)
          example: video/mp4
        filename:
          type: string
          maxLength: 255
          description: Original filename
          example: deadlift.mp4
        content_length:
          type: integer
          format: int64
          minimum: 1
          description: File size in bytes
          example: 52428800

    VideoUploadURLResponse:
      type: object
      required:
        - upload_url
        - object_key
        - expires_in
      properties:
        upload_url:
          type: string
          format: uri
          description: Pre-signed URL for uploading the video via HTTP PUT
        object_key:
          type: string
          description: Object key to be stored in LogEntry.video_object_key after successful upload
        expires_in:
          type: integer
          description: Seconds until the upload URL expires
          example: 900

    VideoDownloadURLRequest:
      type: object
      required:
        - object_key
      properties:
        object_key:
          type: string
          maxLength: 500
          description: Object key from LogEntry.video_object_key

    VideoDownloadURLResponse:
      type: object
      required:
        - download_url
        - expires_in
      properties:
        download_url:
          type: string
          format: uri
          description: Pre-signed URL for downloading the video via HTTP GET
        expires_in:
          type: integer
          description: Seconds until the download URL expires
          example: 3600

    # ========================================
    # Common Response Types
    # ========================================
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details
